<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دانلود کاتالوگ | تجارت دیبا پاسارگاد</title><style>
:root{--bg:#e6ebf2;--sl:#fff;--sd:#bcc6d4;--tx:#2b3a4e;--tx2:#6b7a8f;--ac:#2f6fd0}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.9}
